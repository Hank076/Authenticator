name: CI

on: [push, pull_request]

jobs:
  style:
    runs-on: ubuntu-latest
    name: Style checks

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Prettier
        run: pnpm exec prettier --check ./src/* ./src/**/* ./src/**/**/* ./sass/*.scss

      - name: Check cloud permissions
        run: node scripts/check-cloud-permissions.js

      - name: Check local-only files are not tracked
        run: |
          tracked="$(git ls-files -- docs AGENTS.md CLAUDE.md)"
          if [ -n "$tracked" ]; then
            echo "::error::Local-only files must not be committed:"
            echo "$tracked"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    name: Build ${{ matrix.platform }}

    strategy:
      matrix:
        platform: ["chrome", "firefox"]

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run ${{ matrix.platform }}
  run-tests:
    runs-on: ubuntu-latest
    name: Run tests
    needs: [build]

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test code
        run: xvfb-run --auto-servernum -- pnpm run test
