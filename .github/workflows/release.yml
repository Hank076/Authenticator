name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Build and publish Chrome & Firefox extension ZIPs

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # gh release create uses GH_TOKEN; the public tag fetch needs no
          # credentials, so don't leave the token in .git/config.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build production
        run: |
          node scripts/check-cloud-permissions.js
          pnpm run prod
          test ! -e release/chrome/view/test.html
          test ! -e release/firefox/view/test.html

      - name: Package Firefox
        run: cd release/firefox && zip -r "../../OTPilot-Authenticator-firefox-${GITHUB_REF_NAME}.zip" .

      - name: Package Chrome
        run: cd release/chrome && zip -r "../../OTPilot-Authenticator-chrome-${GITHUB_REF_NAME}.zip" .

      - name: Create release
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          gh release create "$GITHUB_REF_NAME" "OTPilot-Authenticator-firefox-${GITHUB_REF_NAME}.zip" "OTPilot-Authenticator-chrome-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --notes-from-tag
        env:
          GH_TOKEN: ${{ github.token }}
